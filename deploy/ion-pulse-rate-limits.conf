# Install in Nginx's http context (for example /etc/nginx/conf.d/), before the
# Ion Pulse server block. The API keeps its own member-aware limits as a second
# layer; this file protects the service across multiple API workers.
limit_req_zone $binary_remote_addr zone=ion_pulse_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=ion_pulse_community:10m rate=30r/m;
